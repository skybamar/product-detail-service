# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # stand-ins for the real drivers, which live in the company framework
    App\Product\Driver\IElasticSearchDriver: '@App\Product\Driver\InMemoryElasticSearchDriver'
    App\Product\Driver\IMySQLDriver: '@App\Product\Driver\InMemoryMySQLDriver'

    # PRODUCT_SOURCE (elasticsearch|mysql) selects the data source
    App\Product\Repository\ProductRepository:
        factory: ['@App\Product\Repository\ProductRepositoryFactory', 'create']
        arguments: ['%env(PRODUCT_SOURCE)%']

    App\Product\Cache\ProductCache: '@App\Product\Cache\FileProductCache'

    App\Product\Cache\FileProductCache:
        arguments:
            $directory: '%kernel.project_dir%/%env(PRODUCT_CACHE_DIR)%'

    App\Product\Counter\ProductRequestCounter: '@App\Product\Counter\FileProductRequestCounter'

    App\Product\Counter\FileProductRequestCounter:
        arguments:
            $filePath: '%kernel.project_dir%/%env(PRODUCT_COUNTER_FILE)%'
